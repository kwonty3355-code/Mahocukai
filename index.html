<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d14">
  <title>마호츠카이 시제품</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
  <style>
    :root { --bg:#120d14; --fg:#efe6dc; --muted:#a89a9c; --line:#3e3142; --warm:#e9a35f; color-scheme: dark; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif; }
    main { max-width:640px; margin:0 auto; padding:48px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left)); display:grid; gap:18px; }
    h1 { font-family:"Gowun Batang",serif; font-size:34px; margin:0; }
    p { color:var(--muted); margin:0; line-height:1.65; }
    a.card { display:grid; gap:4px; padding:16px 18px; border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
    a.card:hover, a.card:focus-visible { border-color:var(--warm); outline:none; }
    a.card b { font-size:17px; }
    .soon { opacity:.5; padding:16px 18px; border:1px dashed var(--line); border-radius:12px; }
  </style>
</head>
<body>
  <main>
    <h1>마호츠카이 시제품</h1>
    <p>마법산업기능사 게임을 만들기 전에 핵심 아이디어를 하나씩 검증하는 시제품 모음이에요.</p>
    <a class="card" href="./refine.html"><b>① 원석 정제 작업대</b><span>애니를 보면서 생각 없이 손만 움직이는 작업. 몰입이 깨지지 않는지 확인해요.</span></a>
    <div class="soon"><b>② 전투 비교</b> — 타임라인 턴제와 실시간 캐스팅 (준비 중)</div>
    <div class="soon"><b>③ 공방 따라 그리기</b> — 반투명 가이드와 완성도 판정 (준비 중)</div>
  </main>
</body>
</html>
