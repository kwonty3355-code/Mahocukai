<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 위에 그림체 고르는 칩 줄(고정), 아래는 "한눈에" 격자 또는 그림체 하나의 상세(주인공·착장 → 사역마 → 적 → 배경 → 평가). 폰 우선 2열. */
:root{
  --bg:#f4f2ee; --paper:#ffffff; --ink:#1c1a20; --muted:#625c68; --line:#dcd8d0;
  --accent:#8a4b2a; --accent-soft:#f3e4d8; --ok:#2f7d55; --mid:#9a7a2a; --no:#a1462e;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141317; --paper:#1d1b21; --ink:#ece8f0; --muted:#a59fae; --line:#302c36;
  --accent:#e0a070; --accent-soft:#3a2a20; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141317; --paper:#1d1b21; --ink:#ece8f0; --muted:#a59fae; --line:#302c36;
  --accent:#e0a070; --accent-soft:#3a2a20; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-top:28px;padding-bottom:8px;display:grid;gap:8px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(22px,5vw,28px);line-height:1.25;margin:0}
h3{font-size:15px;margin:0;font-weight:700;color:var(--muted);letter-spacing:.02em}
p{margin:0}
.lead{font-size:15px;color:var(--muted)}
.lead b{color:var(--ink)}
nav.chips{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:10px;padding-bottom:10px;margin-top:12px}
nav.chips .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
nav.chips .row::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-current="true"] .n{color:inherit;opacity:.7}
.chip i{width:8px;height:8px;border-radius:50%;display:none}
.chip i.ok{display:block;background:var(--ok)}.chip i.mid{display:block;background:var(--mid)}.chip i.no{display:block;background:var(--no)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:20px;padding-bottom:80px;display:grid;gap:28px}
.over{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:grid;text-align:left;padding:0;font:inherit;color:inherit}
.tile .art{aspect-ratio:1;display:block;background:#111}
.tile .cap{padding:8px 10px 10px;display:grid;gap:0}
.tile .cap b{font-size:15px}
.tile .cap span{font-size:12px;color:var(--muted)}
.tile .badge{font-size:12px;font-weight:700}
.badge.ok{color:var(--ok)}.badge.mid{color:var(--mid)}.badge.no{color:var(--no)}
.art svg,.art canvas{width:100%;height:100%;display:block}
.detail{display:grid;gap:26px}
.dhead{display:grid;gap:8px}
.dhead .num{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.dhead p.d{font-size:16px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
@media (max-width:520px){.pc{grid-template-columns:1fr}}
.pc div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pc b{display:block;font-size:12px;letter-spacing:.06em}
.pc .g b{color:var(--ok)}.pc .r b{color:var(--no)}
.sec{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;padding:0;font:inherit;color:inherit;text-align:left;display:grid}
.card .art{display:block;aspect-ratio:1;background:#111}
.grid.wide .card .art{aspect-ratio:16/9}
.card .cap{padding:7px 10px 9px;font-size:13px;line-height:1.45}
.card .cap b{display:block;font-size:14px}
.card .cap span{color:var(--muted)}
.rate{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.rate .opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:44px}
.opt[aria-pressed="true"][data-v="좋아"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[aria-pressed="true"][data-v="애매"]{background:var(--mid);border-color:var(--mid);color:#fff}
.opt[aria-pressed="true"][data-v="별로"]{background:var(--no);border-color:var(--no);color:#fff}
textarea{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.st{font-size:13px;color:var(--muted);min-height:1.2em}
.st.ok{color:var(--ok)}.st.err{color:var(--no)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.pager button:disabled{opacity:.35;cursor:default}
.honest{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,8,12,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom .box{width:min(100%,720px);display:grid;gap:10px;color:#eee;text-align:center}
.zoom .art{width:100%;aspect-ratio:1;max-height:78vh}
.zoom .art.w{aspect-ratio:16/9}
.zoom .art svg,.zoom .art canvas{width:100%;height:100%;object-fit:contain}
.zoom p{font-size:14px;color:#cfc8d8}
.loading{display:grid;place-items:center;color:#888;font-size:12px;height:100%}
</style>

<div class="wrap">
  <header class="top">
    <h1>그림체 시안 19종</h1>
    <p class="lead">그림체마다 <b>주인공, 착장 3가지, 사역마 3마리, 적 3마리, 배경 3개</b>를 같은 구성으로 그렸어. 위 칩으로 넘기면서 보고, 그림을 누르면 크게 보여. 맨 아래에서 <b>좋아 / 애매 / 별로</b>를 누르면 저장돼.</p>
    <p class="honest">코드로 그린 시안이라 형태는 단순해. 완성 그림이 아니라 <b>"이 그림체로 가면 이런 느낌"</b>을 보는 용도야. 섞고 싶은 게 있으면 메모에 적어줘. 예: "목판화 선 + 스테인드글라스 색"</p>
  </header>
</div>

  let d = 'M0,0 L320,0 L320,16 '; for (let x = 316; x > 0; x -= 14 + rr() * 10){ d += `L${r1(x)},${r1(14 + rr() * 6)} L${r1(x - 4)},${r1(28 + rr() * 26)} L${r1(x - 8)},${r1(14 + rr() * 6)} `; } P.shape(d + 'L0,16Z', 'stone2', { lw: .7 });
  const cluster = (x, y, s, role) => { P.glow(x, y - 22 * s, 46 * s, role, .55);
    [[-.5, 1, -18], [0, 1.4, 0], [.55, 1.1, 16], [-.2, .7, -34], [.3, .65, 32]].forEach(([dx, hk, a]) => { const w = 6 * s, h = 34 * s * hk;
      P.shape(D`M${-w},0 L${-w},${-h} L0,${-h - w * 1.3} L${w},${-h} L${w},0Z`, role, { tf: `translate(${r1(x + dx * 14 * s)},${y}) rotate(${a})`, lw: .7 });
      P.line(D`M0,0 L0,${-h - w * 1.1}`, 'light', .7, { alpha: .6 }); }); };
  P.shape('M0,148 C60,138 100,156 160,150 C220,143 260,156 320,144 L320,180 L0,180Z', 'stone2', { lw: .6 });
  P.shape(E(160, 160, 64, 10), 'water'); P.line('M118,158 L140,158 M150,162 L184,162 M170,156 L196,156', 'crystal', 1, { alpha: .7 });
  cluster(52, 150, 1.3, 'crystal'); cluster(270, 146, 1.1, 'crystal2'); cluster(206, 152, .7, 'crystal'); cluster(110, 152, .6, 'crystal2');
  [[24, 172, 16], [300, 170, 18], [236, 176, 10]].forEach(([x, y, r]) => P.shape(D`M${x - r},${y + 6} C${x - r},${y - r * .7} ${x + r},${y - r * .8} ${x + r},${y + 6}Z`, 'stone', { lw: .6 }));
  for (let i = 0; i < 18; i++) P.dot(20 + rr() * 280, 50 + rr() * 90, .7 + rr(), 'crystal', { alpha: .8 });
}

/* ================= 그리기 ================= */
const SUBJ = {
  hero: [0, 1, 2, 3].map(i => P => hero(P, P.st, i)),
  fam: [famCat, famSalamander, famOphanim],
  foe: [foeImp, foeGargoyle, foeLich],
  bg: [bgStones, bgLibrary, bgCave],
};
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII'];
function metaOf(kind, i){
  if (kind === 'hero') return { label: i ? OUTFITS[i].name + ' 마법사' : '마법사', num: ROMAN[i], cap: i ? `착장 ${i} · ${OUTFITS[i].name}` : '주인공', sub: OUTFITS[i].d };
  if (kind === 'fam') return { label: FAMS[i].name, num: ROMAN[4 + i], cap: `${FAMS[i].name} · ${FAMS[i].rank}`, sub: FAMS[i].d };
  if (kind === 'foe') return { label: FOES[i].name, num: ROMAN[7 + i], cap: `${FOES[i].name} · ${FOES[i].rank}`, sub: FOES[i].d };
  return { label: BGS[i].name, num: ROMAN[10 + i], cap: BGS[i].name, sub: BGS[i].d };
}
function renderInto(el, st, kind, i){
  const W = kind === 'bg' ? 320 : 200, H = kind === 'bg' ? 180 : 200;
  const P = Pen(st, kind, W, H, metaOf(kind, i));
  SUBJ[kind][i](P);
  const svg = P.svg();
  if (!st.post){ el.innerHTML = svg; return; }
  el.innerHTML = '<div class="loading">그리는 중…</div>';
  const img = new Image();
  img.onload = () => {
    const pix = st.post === 'pixel';
    const w = pix ? (W === 200 ? 64 : 104) : (W === 200 ? 44 : 72), h = Math.round(w * H / W);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.drawImage(img, 0, 0, w, h);
    let data = null; try { data = x.getImageData(0, 0, w, h); } catch (e) { data = null; }
    const pal = [...P.used].map(hex2rgb);
    const q = (r, g, b) => { let best = pal[0], bd = 1e9; for (const p of pal){ const d = (r - p[0]) ** 2 * .3 + (g - p[1]) ** 2 * .59 + (b - p[2]) ** 2 * .11; if (d < bd){ bd = d; best = p; } } return best; };
    const outc = document.createElement('canvas');
    if (pix || !data){
      if (data && pal.length){ const a = data.data; for (let i2 = 0; i2 < a.length; i2 += 4){ const p = q(a[i2], a[i2 + 1], a[i2 + 2]); a[i2] = p[0]; a[i2 + 1] = p[1]; a[i2 + 2] = p[2]; a[i2 + 3] = 255; } x.putImageData(data, 0, 0); }
      const s = 6; outc.width = w * s; outc.height = h * s; const o = outc.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(c, 0, 0, w * s, h * s);
    } else {
      const T = 12, gap = 1.6, rr = rng(w * 7 + h); outc.width = w * T; outc.height = h * T; const o = outc.getContext('2d');
      o.fillStyle = '#3a2f22'; o.fillRect(0, 0, outc.width, outc.height);
      const a = data.data;
      for (let j = 0; j < h; j++) for (let i2 = 0; i2 < w; i2++){ const k2 = (j * w + i2) * 4; const v = (rr() - .5) * 26;
        o.fillStyle = `rgb(${a[k2] + v | 0},${a[k2 + 1] + v | 0},${a[k2 + 2] + v | 0})`;
        o.fillRect(i2 * T + gap / 2 + (rr() - .5) * 1.4, j * T + gap / 2 + (rr() - .5) * 1.4, T - gap, T - gap); }
    }
    el.replaceChildren(outc);
  };
  img.onerror = () => { el.innerHTML = svg; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ================= 화면 ================= */
const main = document.getElementById('main'), chips = document.getElementById('chips');
const state = {}, LS = 'mahocukai.styles.draft';
try { Object.assign(state, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
const saveDraft = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };
const cls = v => v === '좋아' ? 'ok' : v === '애매' ? 'mid' : v === '별로' ? 'no' : '';
let db = null, writable = true, current = 'all';

function buildChips(){
  chips.replaceChildren();
  const mk = (id, label, num) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.id = id;
    if (num) { const n = document.createElement('span'); n.className = 'n'; n.textContent = num; b.appendChild(n); }
    b.appendChild(document.createTextNode(label)); const dot = document.createElement('i'); dot.className = cls(state['style-' + id]?.choice); b.appendChild(dot);
    b.setAttribute('aria-current', String(current === id)); b.addEventListener('click', () => go(id)); chips.appendChild(b); };
  mk('all', '한눈에');
  STYLES.forEach((s, i) => mk(s.id, s.name, String(i + 1).padStart(2, '0')));
}
function go(id, noScroll){
  current = id; try { history.replaceState(null, '', '#' + id); } catch (e) {}
  buildChips();
  const act = chips.querySelector('[aria-current="true"]'); if (act) act.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  id === 'all' ? overview() : detail(STYLES.find(s => s.id === id));
  if (!noScroll) window.scrollTo({ top: document.querySelector('nav.chips').offsetTop, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function overview(){
  main.replaceChildren();
  const sec = document.createElement('section'); sec.className = 'sec';
  const h = document.createElement('h2'); h.textContent = '한눈에 보기'; const p = document.createElement('p'); p.className = 'lead'; p.textContent = '각 그림체의 주인공이야. 누르면 그 그림체 전체 세트로 가.';
  const grid = document.createElement('div'); grid.className = 'over';
  STYLES.forEach((s, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tile';
    const art = document.createElement('div'); art.className = 'art'; b.appendChild(art);
    const cap = document.createElement('div'); cap.className = 'cap';
    const t = document.createElement('b'); t.textContent = `${String(i + 1).padStart(2, '0')} ${s.name}`; cap.appendChild(t);
    const v = state['style-' + s.id]?.choice; const sp = document.createElement('span'); if (v){ sp.className = 'badge ' + cls(v); sp.textContent = v; } else sp.textContent = s.d.split('.')[0]; cap.appendChild(sp);
    b.appendChild(cap); b.addEventListener('click', () => go(s.id)); grid.appendChild(b);
    lazy(art, () => renderInto(art, s, 'hero', 0));
  });
  sec.append(h, p, grid); main.appendChild(sec);
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); const f = e.target.__draw; e.target.__draw = null; f && f(); } }), { rootMargin: '300px' }) : null;
function lazy(el, f){ if (io){ el.__draw = f; io.observe(el); } else f(); }
function card(st, kind, i, wide){
  const m = metaOf(kind, i);
  const b = document.createElement('button'); b.type = 'button'; b.className = 'card'; b.setAttribute('aria-label', `${m.cap} 크게 보기`);
  const art = document.createElement('div'); art.className = 'art'; b.appendChild(art);
  const cap = document.createElement('div'); cap.className = 'cap'; const t = document.createElement('b'); t.textContent = m.cap; const s = document.createElement('span'); s.textContent = m.sub; cap.append(t, s); b.appendChild(cap);
  b.addEventListener('click', () => zoom(st, kind, i));
  lazy(art, () => renderInto(art, st, kind, i));
  return b;
}
function section(title, items){ const s = document.createElement('section'); s.className = 'sec'; const h = document.createElement('h3'); h.textContent = title; s.append(h, items); return s; }
function detail(st){
  main.replaceChildren();
  const idx = STYLES.indexOf(st), wrap = document.createElement('div'); wrap.className = 'detail';
  const hd = document.createElement('div'); hd.className = 'dhead';
  const num = document.createElement('p'); num.className = 'num'; num.textContent = `${String(idx + 1).padStart(2, '0')} / ${STYLES.length}`;
  const h = document.createElement('h2'); h.textContent = st.name; const d = document.createElement('p'); d.className = 'd'; d.textContent = st.d;
  const pc = document.createElement('div'); pc.className = 'pc';
  const g = document.createElement('div'); g.className = 'g'; g.innerHTML = '<b>좋은 점</b>'; g.appendChild(document.createTextNode(st.g));
  const r = document.createElement('div'); r.className = 'r'; r.innerHTML = '<b>걱정</b>'; r.appendChild(document.createTextNode(st.r));
  pc.append(g, r); hd.append(num, h, d, pc); wrap.appendChild(hd);
  const grid = (kind, n, wide) => { const gEl = document.createElement('div'); gEl.className = 'grid' + (wide ? ' wide' : ''); for (let i = 0; i < n; i++) gEl.appendChild(card(st, kind, i, wide)); return gEl; };
  wrap.appendChild(section('주인공 · 착장 3가지', grid('hero', 4)));
  wrap.appendChild(section('사역마 3마리', grid('fam', 3)));
  wrap.appendChild(section('적 3마리', grid('foe', 3)));
  wrap.appendChild(section('배경 3개', grid('bg', 3, true)));
  wrap.appendChild(rateBox(st));
  const pg = document.createElement('div'); pg.className = 'pager';
  const prev = document.createElement('button'); prev.type = 'button'; prev.textContent = '← 이전'; prev.disabled = idx === 0; prev.addEventListener('click', () => go(STYLES[idx - 1].id));
  const next = document.createElement('button'); next.type = 'button'; next.textContent = idx === STYLES.length - 1 ? '한눈에 보기' : '다음 →'; next.addEventListener('click', () => go(idx === STYLES.length - 1 ? 'all' : STYLES[idx + 1].id));
  pg.append(prev, next); wrap.appendChild(pg);
  main.appendChild(wrap);
}
const busy = {}, again = {}, timers = {};
let rateUI = null;
function rateBox(st){
  const key = 'style-' + st.id, s = state[key] || (state[key] = { choice: '', note: '' });
  const box = document.createElement('section'); box.className = 'rate'; box.setAttribute('aria-labelledby', 'rate-h');
  const h = document.createElement('h3'); h.id = 'rate-h'; h.textContent = `"${st.name}" 어때?`;
  const opts = document.createElement('div'); opts.className = 'opts'; opts.setAttribute('role', 'group');
  const btns = ['좋아', '애매', '별로'].map(v => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.dataset.v = v; b.textContent = v; b.setAttribute('aria-pressed', String(s.choice === v));
    b.addEventListener('click', () => { const cur = state[key] || (state[key] = { choice: '', note: '' }); cur.choice = cur.choice === v ? '' : v; btns.forEach(x => x.setAttribute('aria-pressed', String(cur.choice === x.dataset.v))); save(key, st.name); buildChips(); }); return b; });
  opts.append(...btns);
  const ta = document.createElement('textarea'); ta.rows = 2; ta.placeholder = '좋은 점, 섞고 싶은 점 (선택)'; ta.value = s.note || ''; ta.setAttribute('aria-label', `${st.name} 메모`);
  ta.addEventListener('input', () => { (state[key] || (state[key] = { choice: '', note: '' })).note = ta.value; clearTimeout(timers[key]); timers[key] = setTimeout(() => { timers[key] = null; save(key, st.name); }, 900); });
  ta.addEventListener('blur', () => { if (timers[key]){ clearTimeout(timers[key]); timers[key] = null; save(key, st.name); } });
  const stEl = document.createElement('p'); stEl.className = 'st'; stEl.setAttribute('aria-live', 'polite');
  stEl.textContent = db ? '' : '여기선 저장이 안 될 수 있어. 그럼 채팅으로 알려줘.';
  box.append(h, opts, ta, stEl);
  rateUI = { key, btns, ta, stEl, s };
  return box;
}
async function save(key, title){
  saveDraft();
  if (!db || !writable) return;
  if (busy[key]){ again[key] = true; return; }
  busy[key] = true; const u = rateUI && rateUI.key === key ? rateUI : null;
  if (u){ u.stEl.className = 'st'; u.stEl.textContent = '저장 중…'; }
  try { const s = state[key]; await db.doc('answers/' + key).set({ q: key, title, choice: s.choice || '', note: s.note || '', updatedAt: new Date().toISOString() });
    if (u){ u.stEl.className = 'st ok'; u.stEl.textContent = '저장됨'; } }
  catch (e) { if (u){ u.stEl.className = 'st err'; u.stEl.textContent = e && e.code === 'invalid_argument' ? '이 계정으로는 저장할 수 없어. 채팅으로 알려줘.' : '저장이 안 됐어. 잠시 뒤에 다시 해줘.'; } if (e && e.code === 'invalid_argument') writable = false; }
  busy[key] = false; if (again[key]){ again[key] = false; save(key, title); }
}

/* 크게 보기 */
const zoomEl = document.getElementById('zoom'), zoomArt = document.getElementById('zoomArt'), zoomCap = document.getElementById('zoomCap');
let lastFocus = null;
function zoom(st, kind, i){
  lastFocus = document.activeElement; const m = metaOf(kind, i);
  zoomArt.className = 'art' + (kind === 'bg' ? ' w' : ''); renderInto(zoomArt, st, kind, i);
  zoomCap.textContent = `${st.name} · ${m.cap} — ${m.sub}`; zoomEl.hidden = false; zoomEl.tabIndex = -1; zoomEl.focus();
}
const closeZoom = () => { zoomEl.hidden = true; zoomArt.replaceChildren(); if (lastFocus) lastFocus.focus(); };
zoomEl.addEventListener('click', closeZoom);
addEventListener('keydown', e => { if (e.key === 'Escape' && !zoomEl.hidden) closeZoom(); });

const start = (location.hash || '').slice(1);
go(STYLES.some(s => s.id === start) ? start : 'all', true);

(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) return;
  if (rateUI) rateUI.stEl.textContent = '';
  db.collection('answers').onSnapshot(snap => {
    snap.docs.forEach(d => { const v = d.data(); if (!v || !d.id.startsWith('style-')) return; const key = d.id;
      if (busy[key] || timers[key]) return;
      state[key] = { choice: typeof v.choice === 'string' ? v.choice : '', note: typeof v.note === 'string' ? v.note : '' };
      if (rateUI && rateUI.key === key){ rateUI.s = state[key]; rateUI.btns.forEach(b => b.setAttribute('aria-pressed', String(state[key].choice === b.dataset.v))); if (document.activeElement !== rateUI.ta) rateUI.ta.value = state[key].note; }
    });
    saveDraft(); buildChips();
  }, () => {});
})();
window.__S = { STYLES, renderInto };
})();
