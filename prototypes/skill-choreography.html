<title>스킬 연출 시연</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* Layout: 위 전장(고정) + 단계 표시 줄 → 스킬 5개 버튼 → 속도 → 스킬 설명 카드와 평가. 폰 우선. */
:root{
  --bg:#f2f0ec; --paper:#ffffff; --ink:#1c1a20; --muted:#625c68; --line:#dcd8d0;
  --accent:#d8432a; --accent-soft:#f6e2dc; --ok:#2f7d55; --mid:#9a7a2a; --no:#a1462e;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121114; --paper:#1b1a1e; --ink:#ece8ee; --muted:#a39daa; --line:#2c2930;
  --accent:#ff7a5a; --accent-soft:#3a2420; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121114; --paper:#1b1a1e; --ink:#ece8ee; --muted:#a39daa; --line:#2c2930;
  --accent:#ff7a5a; --accent-soft:#3a2420; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,6vw,32px);line-height:1.2;margin:0}
h2{font-size:15px;color:var(--muted);margin:0;font-weight:700}
p{margin:0}
.lead{color:var(--muted);font-size:15px}
.stage{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:6px;display:grid;gap:6px}
.cv{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#0a090d;cursor:pointer}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.phases{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.phases span{font-size:11px;text-align:center;padding:4px 0;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden;transition:background .08s,color .08s}
.phases span.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.phases span.done{color:var(--ink)}
.spells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.spell{font:inherit;font-weight:700;font-size:13px;border:none;border-radius:12px;padding:11px 4px;cursor:pointer;color:#fff;min-height:52px;line-height:1.3}
.spell small{display:block;font-weight:500;font-size:10px;opacity:.85}
.spell[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:none;background:transparent;color:var(--ink);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:38px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.card h3{margin:0;font-family:var(--serif);font-weight:900;font-size:19px}
.card .meta{font-size:12px;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.steps li{display:grid;grid-template-columns:62px 1fr;gap:8px}
.steps b{color:var(--accent);font-size:12px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:40px}
.opt[aria-pressed="true"][data-v="좋아"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[aria-pressed="true"][data-v="애매"]{background:var(--mid);border-color:var(--mid);color:#fff}
.opt[aria-pressed="true"][data-v="별로"]{background:var(--no);border-color:var(--no);color:#fff}
textarea{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical}
.st{font-size:12px;color:var(--muted);min-height:1.1em}.st.ok{color:var(--ok)}.st.err{color:var(--no)}
.hint{font-size:13px;color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.spell{font-size:11.5px;padding:9px 2px}.phases span{font-size:10px}}
</style>

<div class="wrap">
  <header style="display:grid;gap:8px">
    <h1>스킬 연출 시연</h1>
    <p class="lead">이번엔 번쩍임 크기가 아니라 <b>스킬을 쓰는 동작</b>을 짰어. 모든 스킬이 <b>준비 → 모으기 → 멈춤 → 발사 → 이동 → 타격 → 여운</b> 흐름을 타. 특히 <b>터지기 직전의 짧은 멈춤</b>이 "찍 싸는 것"과 "멋지게 쓰는 것"을 가르는 핵심이래.</p>
    <p class="hint">스킬 버튼을 누르거나 화면을 눌러. <b>0.25배속</b>으로 보면 동작 하나하나가 보여. 소리 켜고 봐.</p>
  </header>
  <div class="stage">
    <div class="cv" id="cv" role="button" tabindex="0" aria-label="전장 화면. 누르면 고른 스킬 다시 쓰기"></div>
    <div class="phases" id="phases" aria-hidden="true"></div>
  </div>
  <section style="display:grid;gap:8px" aria-labelledby="hs"><h2 id="hs">스킬</h2><div class="spells" id="spells"></div>
    <div class="row2"><div class="seg" id="speed" role="group" aria-label="속도"></div><button class="ghost" id="snd" type="button" aria-pressed="true">소리 켜짐</button><button class="ghost" id="calm" type="button" aria-pressed="false">번쩍임·흔들림 줄이기</button></div></section>
  <section id="desc" class="card" aria-live="polite"></section>
  <section class="card" aria-labelledby="ho"><h2 id="ho">전체 한마디</h2><p class="hint">타격감, 길이, 어떤 스킬이 제일 "멋지게 쓰는" 느낌인지.</p><textarea id="overall" rows="3" placeholder="예: 도장 낙인 최고, 칼바람은 더 빠르게"></textarea><p class="st" id="overallSt" aria-live="polite"></p></section>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const eout = t => 1 - Math.pow(1 - t, 3), ein = t => t * t * t, eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rand = (a, b) => a + Math.random() * (b - a);
const PH = ['준비', '모으기', '멈춤', '발사', '이동', '타격', '여운'];

/* ---------- 소리: 타격은 3겹(딱-쿵-웅) ---------- */
let AC = null, master = null, duckG = null, soundOn = true;
function audio(){ if (!soundOn) return null; try { if (!AC){ const K = window.AudioContext || window.webkitAudioContext; if (!K) return null; AC = new K(); master = AC.createGain(); master.gain.value = .6; duckG = AC.createGain(); duckG.gain.value = 1; const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 5; master.connect(duckG); duckG.connect(comp); comp.connect(AC.destination); } if (AC.state === 'suspended') AC.resume(); } catch (e) { return null; } return AC; }
const nbuf = {}; function nb(d){ const k = Math.ceil(d * 10); if (nbuf[k]) return nbuf[k]; const b = AC.createBuffer(1, AC.sampleRate * (k / 10 + .05), AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; return nbuf[k] = b; }
function osc(type, f0, f1, d, v, s = 0){ if (!audio()) return; const t = AC.currentTime + s, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .03); }
function noise(type, f0, f1, d, v, q = .8, s = 0, att = .004){ if (!audio()) return; const t = AC.currentTime + s, src = AC.createBufferSource(); src.buffer = nb(d); const f = AC.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d); const g = AC.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d); src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + d + .05); }
function duck(on, len = .05){ if (!AC) return; duckG.gain.cancelScheduledValues(AC.currentTime); duckG.gain.setTargetAtTime(on ? .12 : 1, AC.currentTime, on ? .04 : len); }
const semi = n => Math.pow(2, n / 12);
function hitSnd(w, pitch = 0){ const p = semi(pitch) * rand(.96, 1.04);
  noise('highpass', 3000 * p, 6000 * p, .04, .5 * (.5 + w * .5));
  osc('sine', 150 * p, 38, .12 + w * .45, Math.min(1, .35 + w * .6));
  if (w > .5){ noise('lowpass', 2400, 90, .4 + w * .9, .45 * w); osc('triangle', 110, 104, .8 + w, .14 * w); osc('triangle', 117, 112, .9 + w, .1 * w); } }
const charge = (d, f0 = 300, f1 = 1400) => { noise('bandpass', f0, f1, d, .22, 2.5, 0, d * .8); osc('sine', f0 * .5, f1 * .5, d, .08); };
const whoosh = (d = .2, f0 = 600, f1 = 4000, v = .35) => noise('bandpass', f0, f1, d, v, 1.4);
const thunk = (pitch = 0) => { osc('sine', 220 * semi(pitch), 90, .12, .45); noise('lowpass', 1800, 300, .08, .3); };
const tak = (pitch = 0) => { noise('highpass', 2500 * semi(pitch), 5000, .03, .35); osc('square', 900 * semi(pitch), 700, .04, .08); };

/* ---------- 무대 ---------- */
const host = document.getElementById('cv'), cv = document.createElement('canvas'), x = cv.getContext('2d'); host.appendChild(cv);
const buf = document.createElement('canvas'), bx = buf.getContext('2d');
let W = 0, H = 0, DPR = 1;
function fit(){ const r = host.getBoundingClientRect(); DPR = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); buf.width = Math.max(1, cv.width >> 2); buf.height = Math.max(1, cv.height >> 2); }
fit(); addEventListener('resize', fit);
const SHAPE = ['XX...XX', 'X.....X', '.......', '.......', '.......', 'X.....X', 'XX...XX'];
const tw = () => W / 6.3;
const tc = (c, r) => { const t = tw(); return [W / 2 + (c - r) * t / 2, H * .14 + (c + r) * t / 4 + t / 4]; };

/* 스프링: 찌그러짐·흔들림이 자연스럽게 돌아오게 */
const spring = (v, k = 260, d = 14) => ({ x: v, v: 0, to: v, k, d });
const sstep = (s, dt) => { const a = -s.k * (s.x - s.to) - s.d * s.v; s.v += a * dt; s.x += s.v * dt; };
const MAGE = { c: 1, r: 5, ox: spring(0, 200, 18), oy: spring(0, 200, 18), sx: spring(1, 320, 12), sy: spring(1, 320, 12), rot: spring(0, 200, 14), glow: 0, ghosts: [], float: spring(0, 60, 9), talisman: 0, hidden: false };
const FAM = { x: 0, y: 0, open: 1, spin: 1, show: 0, slit: 0 };
const FOES = [[4, 2], [5, 1], [5, 3]].map(([c, r], i) => ({ c, r, i, kx: spring(0, 300, 16), ky: spring(0, 300, 16), sq: spring(1, 400, 12), flash: 0, cracks: [] }));
const S = { real: 0, T: 0, stop: 0, slowUntil: 0, slowScale: 1, trauma: 0, zoom: spring(1, 90, 14), zx: 0, zy: 0, dim: spring(0, 40, 12), letter: spring(0, 60, 14), frameUntil: 0, frameX: 0, frameY: 0, busy: false, phase: -1, speed: 1, calm: false, title: null, combo: null };
let parts = [], fx = [], nums = [], ev = [];

const at = (t, fn) => ev.push({ t, fn });
const P = o => { const p = Object.assign({ vx: 0, vy: 0, g: 0, drag: 0, life: 1, r: 2, col: '#fff', add: true, kind: 'dot', shrink: true }, o); p.max = p.life; parts.push(p); };
const FX = (dur, draw, o = {}) => fx.push(Object.assign({ t0: S.T, dur, draw }, o));
function phase(i){ S.phase = i; const els = document.getElementById('phases').children; [...els].forEach((e, j) => { e.classList.toggle('on', j === i); e.classList.toggle('done', i >= 0 && j < i); }); }

/* 타격: 숫자는 조사 결과의 시작값 */
const WEIGHT = { light: { stop: .066, trauma: .2, num: 1, knock: 7 }, mid: { stop: .116, trauma: .35, num: 1.25, knock: 11 }, heavy: { stop: .2, trauma: .6, num: 1.6, knock: 16 }, fin: { stop: .33, trauma: .85, num: 2.1, knock: 22 } };
function hit(foe, w, col, opt = {}){
  const W8 = WEIGHT[w]; S.stop = Math.max(S.stop, W8.stop); S.trauma = Math.min(1, S.trauma + W8.trauma * (S.calm ? .35 : 1));
  const [fx0, fy0] = tc(foe.c, foe.r), cx = fx0, cy = fy0 - tw() * .55;
  const dir = opt.dir || [1, -.3]; const dl = Math.hypot(dir[0], dir[1]) || 1;
  foe.kx.v += dir[0] / dl * W8.knock * 22; foe.ky.v += dir[1] / dl * W8.knock * 22; foe.sq.x = .78; foe.flash = .05;
  if (foe.cracks.length < 6) foe.cracks.push(rand(0, TAU));
  hitSnd(w === 'light' ? .2 : w === 'mid' ? .45 : w === 'heavy' ? .8 : 1, opt.pitch || 0);
  if (w === 'heavy' || w === 'fin'){ S.zoom.x = 1 + (w === 'fin' ? .09 : .06); S.zx = cx; S.zy = cy; if (!S.calm){ S.frameUntil = S.real + (w === 'fin' ? .07 : .05); S.frameX = cx; S.frameY = cy; } }
  if (w === 'fin'){ S.slowUntil = S.real + .5 + W8.stop; S.slowScale = .25; }
  const n = { light: 14, mid: 26, heavy: 50, fin: 90 }[w];
  for (let i = 0; i < n; i++){ const a = rand(0, TAU), v = rand(80, 320) * (w === 'fin' ? 1.5 : 1); P({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .6 - 60, g: 380, drag: 2.2, life: rand(.3, .7), r: rand(1.2, 2.6), col: Math.random() < .5 ? col : '#fff6e0', kind: 'streak' }); }
  const rr = tw() * ({ light: .5, mid: .8, heavy: 1.2, fin: 1.8 }[w]);
  FX(.32, k => { ring(cx, cy, rr * eout(k), col, (1 - k) * 3 + .6, 1 - k); });
  if (w !== 'light') FX(.45, k => { ring(cx, cy + tw() * .5, rr * 1.4 * eout(k), col, 2 * (1 - k), (1 - k) * .8, .45); });
  FX(.18, k => halo(cx, cy, rr * (1 + k), '#ffffff', 1 - k));
  const dmg = Math.round({ light: 340, mid: 820, heavy: 2400, fin: 7800 }[w] * rand(.9, 1.1));
  nums.push({ x: cx + rand(-10, 10) + (opt.nx || 0), y: cy - tw() * .4 + (opt.ny || 0), v: dmg, t0: S.real, s: W8.num, crit: w === 'fin' || (w === 'heavy' && Math.random() < .5) });
}

/* ---------- 그리기 도우미 ---------- */
function halo(cx, cy, r, col, a){ if (r <= 1 || a <= .01) return; x.save(); x.globalCompositeOperation = 'lighter'; const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); x.globalAlpha = Math.min(1, a); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); x.restore(); }
function gl(build, col, w, a = 1){ if (a <= .01) return; x.save(); x.globalCompositeOperation = 'lighter'; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); build(); x.strokeStyle = col; x.globalAlpha = .16 * a; x.lineWidth = w * 5; x.stroke(); x.globalAlpha = .4 * a; x.lineWidth = w * 2.2; x.stroke(); x.globalAlpha = a; x.lineWidth = w; x.strokeStyle = '#fffaf0'; x.stroke(); x.restore(); }
function ring(cx, cy, r, col, w, a, flat = .5){ gl(() => x.ellipse(cx, cy, Math.max(.1, r), Math.max(.1, r * flat), 0, 0, TAU), col, w, a); }
function circle(cx, cy, r, col, prog, spin, a, flat = .5, rot = 0){
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(1, flat);
  gl(() => x.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(prog * 1.6)), col, 1.6, a);
  gl(() => x.arc(0, 0, r * .8, spin, spin + TAU * clamp(prog * 1.6 - .3)), col, 1, a * .8);
  x.rotate(-spin * 1.4); if (prog > .4) gl(() => { for (let i = 0; i <= 5; i++){ const an = i * 2 * TAU / 5 - Math.PI / 2; i ? x.lineTo(Math.cos(an) * r * .78, Math.sin(an) * r * .78) : x.moveTo(Math.cos(an) * r * .78, Math.sin(an) * r * .78); } }, col, 1, a * clamp((prog - .4) / .4));
  for (let i = 0; i < 12; i++){ if (i / 12 > prog) break; const an = i / 12 * TAU + spin; gl(() => { x.moveTo(Math.cos(an) * r * .88, Math.sin(an) * r * .88); x.lineTo(Math.cos(an) * r, Math.sin(an) * r); }, col, 1, a * .8); }
  x.restore();
}
function board(){
  const t = tw(), th = t / 2;
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++){ if (SHAPE[r][c] === 'X') continue; const [px, py] = tc(c, r);
    x.beginPath(); x.moveTo(px, py - th / 2); x.lineTo(px + t / 2, py); x.lineTo(px, py + th / 2); x.lineTo(px - t / 2, py); x.closePath();
    x.fillStyle = (r + c) % 2 ? '#1e1b2a' : '#24213a'; x.fill(); x.strokeStyle = '#34304c'; x.lineWidth = 1; x.stroke();
    if (r === 6 || SHAPE[r + 1][c] === 'X'){ x.fillStyle = '#100e18'; x.beginPath(); x.moveTo(px - t / 2, py); x.lineTo(px, py + th / 2); x.lineTo(px, py + th / 2 + 7); x.lineTo(px - t / 2, py + 7); x.fill(); }
    if (c === 6 || SHAPE[r][c + 1] === 'X'){ x.fillStyle = '#0b0a12'; x.beginPath(); x.moveTo(px + t / 2, py); x.lineTo(px, py + th / 2); x.lineTo(px, py + th / 2 + 7); x.lineTo(px + t / 2, py + 7); x.fill(); } }
}
function magePos(){ const [px, py] = tc(MAGE.c, MAGE.r); return [px + MAGE.ox.x, py + MAGE.oy.x - MAGE.float.x]; }
function drawRect(px, py, sx, sy, rot, alpha, ink){
  const t = tw(), bw = t * .3, bh = t * .78;
  x.save(); x.globalAlpha = alpha; x.translate(px, py); x.rotate(rot); x.scale(sx, sy);
  if (ink){ x.fillStyle = ink; x.fillRect(-bw / 2, -bh, bw, bh); x.restore(); return; }
  const g = x.createLinearGradient(-bw / 2, -bh, bw / 2, 0); g.addColorStop(0, '#ff6a40'); g.addColorStop(1, '#c8381f'); x.fillStyle = g; x.fillRect(-bw / 2, -bh, bw, bh);
  x.fillStyle = 'rgba(60,10,0,.22)'; x.fillRect(0, -bh, bw / 2, bh);
  x.restore();
}
function mage(){
  if (MAGE.hidden) return;
  const [px, py] = magePos(), [bx0, by0] = tc(MAGE.c, MAGE.r), t = tw(), bh = t * .78;
