<title>캐릭터 방향 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* Layout: 위 칩 줄(고정)로 방향 8개를 넘김. 상세는 마법사·적 → 기사→왕 → 판 장면 → 평가 순. 폰 우선 2열. */
:root{
  --bg:#f4f2ee; --paper:#ffffff; --ink:#1c1a20; --muted:#625c68; --line:#dcd8d0;
  --accent:#8a4b2a; --accent-soft:#f3e4d8; --ok:#2f7d55; --mid:#9a7a2a; --no:#a1462e;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141317; --paper:#1d1b21; --ink:#ece8f0; --muted:#a59fae; --line:#302c36;
  --accent:#e0a070; --accent-soft:#3a2a20; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141317; --paper:#1d1b21; --ink:#ece8f0; --muted:#a59fae; --line:#302c36;
  --accent:#e0a070; --accent-soft:#3a2a20; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-top:28px;padding-bottom:8px;display:grid;gap:8px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,6vw,36px);line-height:1.2;margin:0}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(22px,5vw,28px);line-height:1.25;margin:0}
h3{font-size:15px;margin:0;font-weight:700;color:var(--muted);letter-spacing:.02em}
p{margin:0}
.lead{font-size:15px;color:var(--muted)} .lead b{color:var(--ink)}
.honest{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
nav.chips{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:10px;padding-bottom:10px;margin-top:12px}
nav.chips .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.chips .row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.chip .n{font-size:12px;color:var(--muted)}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-current="true"] .n{color:inherit;opacity:.7}
.chip i{width:8px;height:8px;border-radius:50%;display:none}
.chip i.ok{display:block;background:var(--ok)}.chip i.mid{display:block;background:var(--mid)}.chip i.no{display:block;background:var(--no)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:20px;padding-bottom:80px;display:grid;gap:28px}
.sec{display:grid;gap:10px}
.over{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:grid;text-align:left;padding:0;font:inherit;color:inherit}
.tile .pair{display:grid;grid-template-columns:1fr 1fr}
.tile .art{aspect-ratio:200/240;background:#222}
.tile .cap{padding:8px 12px 10px;display:grid}
.tile .cap b{font-size:15px}
.tile .cap span{font-size:12px;color:var(--muted)}
.badge{font-weight:700}.badge.ok{color:var(--ok)}.badge.mid{color:var(--mid)}.badge.no{color:var(--no)}
.art svg,.art canvas{width:100%;height:100%;display:block}
.detail{display:grid;gap:26px}
.dhead{display:grid;gap:8px}
.dhead .num{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.08em}
.dhead .refs{font-size:13px;color:var(--muted)}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
@media (max-width:520px){.pc{grid-template-columns:1fr}}
.pc div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pc b{display:block;font-size:12px;letter-spacing:.06em}
.pc .g b{color:var(--ok)}.pc .r b{color:var(--no)}
.hint{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;padding:0;font:inherit;color:inherit;text-align:left;display:grid}
.card .art{aspect-ratio:200/240;background:#222}
.card .art.board{aspect-ratio:360/230}
.card .cap{padding:7px 10px 9px;font-size:13px;line-height:1.45}
.card .cap b{display:block;font-size:14px}
.card .cap span{color:var(--muted)}
.rate{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.rate .opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:inherit;font-weight:700;font-size:15px;padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:44px}
.opt[aria-pressed="true"][data-v="좋아"]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[aria-pressed="true"][data-v="애매"]{background:var(--mid);border-color:var(--mid);color:#fff}
.opt[aria-pressed="true"][data-v="별로"]{background:var(--no);border-color:var(--no);color:#fff}
textarea{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.st{font-size:13px;color:var(--muted);min-height:1.2em}.st.ok{color:var(--ok)}.st.err{color:var(--no)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:48px}
.pager button:disabled{opacity:.35;cursor:default}
.zoom{position:fixed;inset:0;z-index:20;background:rgba(10,8,12,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom .box{width:min(100%,560px);display:grid;gap:10px;color:#eee;text-align:center}
.zoom .art{width:100%;aspect-ratio:200/240;max-height:78vh}
.zoom .art.w{aspect-ratio:360/230}
.zoom .art svg,.zoom .art canvas{object-fit:contain}
.zoom p{font-size:14px;color:#cfc8d8}
</style>

<div class="wrap">
  <header class="top">
    <h1>캐릭터 방향 시안 8종</h1>
    <p class="lead">이번엔 칠하는 법이 아니라 <b>뼈대</b>를 바꿨어. 비율, 실루엣, 얼굴, 사역마를 어떤 존재로 보는지가 방향마다 달라. 방향마다 <b>마법사, 적, 같은 사역마의 기사→왕, 7×7 판 장면</b>이 있어.</p>
    <p class="honest">코드로 그린 방향 시험지야. 최종 그림이 아니라 "이 뼈대로 가면 이런 게임"을 보는 용도. 마음에 드는 방향이 정해지면 최종 그림을 어떻게 얻을지 같이 정하자.</p>
  </header>
</div>
<nav class="chips" aria-label="방향 선택"><div class="wrap"><div class="row" id="chips"></div></div></nav>
<div class="wrap"><main id="main"></main></div>
<div class="zoom" id="zoom" hidden tabindex="-1" role="dialog" aria-modal="true" aria-label="크게 보기"><div class="box"><div class="art" id="zoomArt"></div><p id="zoomCap"></p></div></div>
<script>
/* 공통 도우미 + 방향 1~4 */
const H = {};
H.p = (d, f, a = '') => `<path d="${d}" fill="${f}" ${a}/>`;
H.c = (x, y, r, f, a = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${a}/>`;
H.e = (x, y, rx, ry, f, a = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${a}/>`;
H.l = (d, s, w, a = '') => `<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${a}/>`;
H.g = (s, a = '') => `<g ${a}>${s}</g>`;
/* 바깥 외곽선은 굵게: 같은 모양을 먼저 굵은 선으로 깔고 위에 색을 얹는다 */
H.OL = (shapes, w, col) => `<g fill="${col}" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round">${shapes.replace(/ fill="(?!none)[^"]*"/g, '').replace(/ opacity="[^"]*"/g, '')}</g>${shapes}`;
/* 살아 있는 눈: 흰자, 홍채, 동공, 같은 쪽 하이라이트 두 개 */
H.eye = (x, y, r, iris, look = [0, 0], pupil = '#1a1014') => {
  const ix = x + look[0], iy = y + look[1];
  return H.c(x, y, r, '#fffaf2') + H.c(ix, iy, r * .7, iris) + H.c(ix + look[0] * .15, iy + look[1] * .15, r * .4, pupil) + H.c(ix - r * .26, iy - r * .3, r * .22, '#fff') + H.c(ix + r * .22, iy + r * .2, r * .09, '#fff');
};
H.glow = (id, x, y, r, col, a = .8) => ({ def: `<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity="${a}"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`, el: H.c(x, y, r, `url(#${id})`) });
H.star = (cx, cy, r, n = 5, k = .45) => { let d = ''; for (let i = 0; i < n * 2; i++){ const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * k : r; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1); } return d + 'Z'; };

H.noBg = false;
H.bg = s => H.noBg ? '' : s;
const DIRS = [];

/* =========================================================
   1. 살아 있는 마도구 — 사역마는 악마가 깃든 도구
   ========================================================= */
(() => {
  const K = '#2a1a14', P = H.p, C = H.c, E = H.e, L = H.l;
  const brass = '#d9a441', brassL = '#f2c869', brassD = '#a8742a', wax = '#f7efdf', waxS = '#e6d5b8', fl = '#ff7a2a', fl2 = '#ffc14a', fl3 = '#fff3b0';
  const bg = (id, glow) => { const g = H.glow(id + 'g', 100, 120, 110, glow, .55); return { def: g.def, el: H.bg(`<rect width="200" height="240" fill="#f3e7cd"/>` + g.el + `<g fill="none" stroke="#c9a878" stroke-width="1" opacity=".55"><circle cx="100" cy="128" r="86"/><circle cx="100" cy="128" r="80"/><path d="${H.star(100, 128, 80, 7, .5)}"/></g>` + E(100, 224, 70, 9, '#2a1a14', 'opacity=".16"')) }; };

  const mage = () => {
    const b = bg('d1m', '#ffd9a0');
    const body = [
      P('M74,196 L72,222 Q86,227 98,222 L96,196Z', '#5a3a24'), P('M104,196 L104,222 Q118,227 131,221 L126,196Z', '#5a3a24'),
      P('M74,118 C70,150 66,180 63,200 L137,200 C134,180 130,150 126,118 Q100,108 74,118Z', '#4a6a8a'),
      P('M81,128 L119,128 L126,202 L74,202Z', '#f1e4c6'),
      P('M124,122 C140,114 148,98 151,84 L162,90 C156,110 146,126 131,136Z', '#4a6a8a'),
      P('M76,124 C62,138 59,156 69,167 L86,161 C80,150 82,140 87,132Z', '#4a6a8a'),
      P('M57,171 L102,165 L104,178 L60,184Z', '#b8452f'), P('M61,158 L100,155 L101,167 L63,170Z', '#3f6a4a'), P('M59,147 L96,147 L96,157 L59,157Z', '#c9963a'),
      C(84, 165, 7, '#f3cfae'), C(156, 86, 7.5, '#f3cfae'),
      P('M152,90 L178,24 Q189,40 174,60 Q167,73 158,88Z', '#fbf5e6'),
      P('M108,44 C112,30 124,27 129,34 C121,34 115,38 113,47Z', '#7a4a2a'),
      C(100, 82, 34, '#f3cfae'),
      P('M66,82 C63,50 86,40 104,42 C127,42 141,58 136,86 C130,71 122,64 112,66 C116,75 109,77 104,68 C98,77 88,75 86,66 C78,70 71,77 66,82Z', '#7a4a2a'),
      P('M40,56 C48,42 62,40 74,48 C72,52 71,55 70,58 C60,54 50,52 40,56Z', '#2f5a5a'),
      P('M68,63 C70,35 96,22 118,30 C134,36 141,50 139,63 C120,55 90,55 68,63Z', '#2f5a5a'),
    ].join('');
    const det = [
      P('M68,63 C90,55 120,55 139,63 L138,69 C119,62 90,62 69,69Z', brass),
      L('M150,32 L130,40 M147,46 L128,48', '#7a4a2a', 1.6, 'opacity=".5"'),
      L('M174,30 L158,86', '#b8a888', 1.6),
      C(181, 22, 3, '#2b3550'),
      E(96, 160, 5, 3.5, '#2b3550', 'opacity=".75"'), C(108, 182, 2.6, '#2b3550', 'opacity=".7"'), C(90, 188, 1.8, '#2b3550', 'opacity=".7"'),
      L('M62,152 L96,152 M64,162 L99,161 M62,176 L101,172', '#fff7e6', 1.2, 'opacity=".8"'),
      L('M100,128 L100,200', '#d8c8a2', 1.4),
      E(84, 91, 3.2, 4.2, K), E(114, 90, 3.2, 4.2, K), C(83, 89.2, 1.3, '#fff'), C(113, 88.2, 1.3, '#fff'),
      `<g fill="#ffffff" fill-opacity=".28" stroke="${K}" stroke-width="3.2"><circle cx="85" cy="90" r="13"/><circle cx="115" cy="89" r="13"/></g>`,
      L('M98,90 Q100,87 102,90', K, 2.6), L('M78,84 L83,80 M108,83 L113,79', '#fff', 2.2),
      P('M95,104 Q101,111 107,104 Q101,107.5 95,104Z', '#9a3a30'),
      E(76, 101, 6, 3.2, '#f29a8a', 'opacity=".6"'), E(125, 100, 6, 3.2, '#f29a8a', 'opacity=".6"'),
      C(72, 96, 1, '#a0603a'), C(76, 99, 1, '#a0603a'), C(128, 95, 1, '#a0603a'),
      C(125, 108, 3, '#2b3550', 'opacity=".8"'),
    ].join('');
    return { defs: b.def, svg: b.el + H.OL(body, 7, K) + det };
  };

  const candleFace = (lid) => [
    H.eye(88, 150, 10.5, '#7a3a1a', [2, -2]), H.eye(115, 148, 10.5, '#7a3a1a', [2, -2]),
    lid ? P('M76,146 C80,134 98,134 100,146Z M103,144 C107,132 125,132 127,144Z', wax) + L('M77,146 Q88,141 99,146 M104,144 Q115,139 126,144', K, 2.4) : L('M80,134 L94,137 M108,135 L121,131', K, 2.6),
    P('M96,166 Q102,174 109,165 Q102,169 96,166Z', '#8a2a20'),
    E(78, 165, 6.5, 3.5, '#f39a8a', 'opacity=".55"'), E(124, 162, 6.5, 3.5, '#f39a8a', 'opacity=".55"'),
  ].join('');

  const famK = () => {
    const b = bg('d1k', '#ffc070'), gl = H.glow('d1kf', 103, 70, 62, '#ffb340', .7);
    const body = [
      C(152, 205, 13, brass), E(100, 214, 50, 12, brassD), E(100, 208, 44, 9, brassL),
      P('M72,206 L72,112 Q72,102 82,101 L118,99 Q128,100 128,110 L128,206Z', wax),
      P('M72,112 Q72,102 82,101 L118,99 Q128,100 128,110 L128,128 Q124,137 121,127 L120,116 Q116,122 114,141 Q110,150 107,140 L106,113 Q98,117 92,113 L90,119 Q86,125 82,119 L80,113 L77,134 Q72,142 72,130Z', '#fffaf0'),
      P('M80,158 Q77,172 80,184 Q85,189 86,179 Q85,170 85,160Z', '#fffaf0'),
      P('M100,100 C80,96 77,70 92,52 C98,44 104,34 112,20 C115,40 129,54 127,74 C125,92 115,100 100,100Z', fl),
    ].join('');
    const det = [
      C(152, 205, 7, b ? '#f3e7cd' : '#fff'),
      P('M118,104 L128,110 L128,206 L118,206Z', waxS, 'opacity=".6"'),
      P('M101,98 C90,94 90,78 98,66 C102,60 106,52 110,46 C112,60 120,70 118,82 C116,94 110,98 101,98Z', fl2),
      P('M102,96 C96,92 97,84 101,78 C104,84 109,88 107,93 C106,96 104,97 102,96Z', fl3),
      L('M101,100 L103,92', K, 2.4),
      candleFace(false),
      L('M72,172 Q59,175 62,188 Q66,192 72,187', brassD, 4), L('M128,166 Q146,156 151,137', brassD, 4),
      L('M149,141 L171,92', '#e8c48a', 5.5), E(172, 88, 5, 7.5, '#c8322a', 'transform="rotate(25 172 88)"'), C(176, 80, 2.4, fl3),
      P('M90,186 L110,186 L110,196 Q100,204 90,196Z', '#9aa3ad', `stroke="${K}" stroke-width="2"`), L('M100,188 L100,200 M93,192 L107,192', '#5a6370', 2),
    ].join('');
    return { defs: b.def + gl.def, svg: b.el + gl.el + H.OL(body, 7, K) + det };
  };

  const famKing = () => {
    const b = bg('d1g', '#e8b0ff'), gl = H.glow('d1gf', 100, 60, 80, '#ffb340', .6);
    const arms = [[56, 70], [76, 58], [124, 58], [144, 70]];
    const body = [
      P('M50,212 C44,160 56,118 80,110 L122,110 C146,118 158,160 152,212 Q100,224 50,212Z', '#6a2a5a'),
      P('M54,226 L72,196 L130,196 L148,226 L134,226 L120,208 L82,208 L68,226Z', brass),
      P('M68,200 L68,98 Q68,88 78,87 L124,86 Q134,87 134,98 L134,200Z', wax),
      ...arms.map(([x, y]) => P(`M${x - 6},${y + 18} L${x - 6},${y} L${x + 6},${y} L${x + 6},${y + 18}Z`, wax)),
      ...arms.map(([x, y]) => P(`M${x},${y} C${x - 7},${y - 4} ${x - 6},${y - 16} ${x + 1},${y - 24} C${x + 6},${y - 14} ${x + 7},${y - 4} ${x},${y}Z`, fl)),
      P('M100,86 C76,82 72,52 90,32 C97,24 104,14 112,0 C116,22 132,38 130,60 C128,80 116,88 100,86Z', fl),
      P('M62,100 L138,100 L136,86 L64,86Z', brass),
    ].join('');
    const det = [
      ...arms.map(([x, y]) => L(`M${x},${y + 18} Q${x < 100 ? x + 4 : x - 4},${y + 30} ${x < 100 ? 66 : 134},96`, brass, 4)),
      ...arms.map(([x, y]) => P(`M${x},${y - 2} C${x - 3},${y - 5} ${x - 2},${y - 11} ${x + 1},${y - 15} C${x + 3},${y - 9} ${x + 4},${y - 4} ${x},${y - 2}Z`, fl3)),
      P('M101,84 C88,80 88,62 97,50 C102,42 106,34 110,26 C113,42 122,52 120,66 C118,80 110,84 101,84Z', fl2),
      P('M102,82 C95,78 96,68 101,62 C105,68 110,72 108,78 C107,81 104,82 102,82Z', fl3),
      P('M50,212 Q100,224 152,212 L151,200 Q100,212 51,200Z', '#fffaf0'), ...[[62, 206], [82, 210], [102, 212], [122, 210], [142, 206]].map(([x, y]) => P(`M${x},${y - 3} l2,4 l-2,3 l-2,-3Z`, K)),
      P('M124,100 L134,100 L134,200 L124,200Z', waxS, 'opacity=".55"'),
      P('M68,100 L68,124 Q72,132 75,122 L76,100Z M90,100 L90,112 Q94,120 97,110 L98,100Z', brassL),
      candleFace(true).replace(/88,150/g, '88,152'),
      P('M93,162 C88,160 82,164 80,160 C84,168 92,166 98,163Z M108,163 C114,166 122,168 124,160 C121,164 114,160 109,162Z', brass),
      L('M134,150 Q150,140 154,126', brassD, 4), L('M152,130 L172,52', brass, 5), P('M162,54 L184,50 L177,34Z', brass, `stroke="${K}" stroke-width="2.5" stroke-linejoin="round"`),
      L('M80,132 Q100,150 122,132', brass, 2.6), C(101, 150, 7, brass, `stroke="${K}" stroke-width="2"`), P(H.star(101, 150, 4, 5), '#fff3b0'),
      ...[[64, 93], [82, 93], [100, 93], [118, 93], [136, 93]].map(([x, y]) => C(x, y, 2.6, '#c8322a')),
      C(58, 222, 5, brassD), C(144, 222, 5, brassD),
    ].join('');
    return { defs: b.def + gl.def, svg: b.el + gl.el + H.OL(body, 7, K) + det };

const TW = 44, TH = 22, OX = 180, OY = 46;

const PIECES = [['foe', 2, 1, 'e'], ['foe', 4, 1, 'e'], ['foe', 5, 3, 'e'], ['famK', 1, 4, 'a'], ['mage', 3, 5, 'a']];
const TARGET = new Set(['2,1', '3,1', '4,1', '3,2', '2,2', '4,2']);
function boardSvg(d, withPieces){
  const b = d.board; let s = `<rect width="360" height="230" fill="${b.bg}"/>`;
  if (b.glow) s += `<defs><radialGradient id="bgl${d.id}"><stop offset="0" stop-color="${b.glow}" stop-opacity=".55"/><stop offset="1" stop-color="${b.glow}" stop-opacity="0"/></radialGradient></defs><ellipse cx="180" cy="120" rx="190" ry="110" fill="url(#bgl${d.id})"/>`;
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++){
    if (SHAPE[r][c] === 'X') continue; const [x, y] = tileC(c, r);
    const top = `M${x},${y - TH / 2} L${x + TW / 2},${y} L${x},${y + TH / 2} L${x - TW / 2},${y}Z`;
    if (r === 6 || SHAPE[r + 1][c] === 'X') s += `<path d="M${x - TW / 2},${y} L${x},${y + TH / 2} L${x},${y + TH / 2 + 9} L${x - TW / 2},${y + 9}Z" fill="${b.side}"/>`;
    if (c === 6 || SHAPE[r][c + 1] === 'X') s += `<path d="M${x + TW / 2},${y} L${x},${y + TH / 2} L${x},${y + TH / 2 + 9} L${x + TW / 2},${y + 9}Z" fill="${b.side}" opacity=".8"/>`;
    s += `<path d="${top}" fill="${(r + c) % 2 ? b.top2 : b.top}" stroke="${b.line}" stroke-width="1"/>`;
    if (TARGET.has(c + ',' + r)) s += `<path d="${top}" fill="#ff5a3a" opacity=".28"/><path d="M${x - 8},${y} L${x},${y - 4} L${x + 8},${y} L${x},${y + 4}Z" fill="none" stroke="#ff5a3a" stroke-width="1.2" opacity=".8"/>`;
  }
  const [mx, my] = tileC(3, 1);
  s += `<ellipse cx="${mx}" cy="${my + 6}" rx="62" ry="30" fill="none" stroke="#ffb040" stroke-width="1.6" stroke-dasharray="5 4" opacity=".9"/>`;
  PIECES.forEach(([, c, r, side]) => { const [x, y] = tileC(c, r); s += `<ellipse cx="${x}" cy="${y}" rx="15" ry="7.5" fill="none" stroke="${side === 'a' ? '#4ac8ff' : '#ff4a4a'}" stroke-width="2.4"/>`; });
  if (withPieces){
    PIECES.slice().sort((a, z) => (a[1] + a[2]) - (z[1] + z[2])).forEach(([k, c, r]) => {
      const [x, y] = tileC(c, r), rr = drawChar(d, k, true), w = k === 'mage' ? 58 : 52, h = w * 1.2;
      s += `<svg x="${x - w / 2}" y="${y - h * .94}" width="${w}" height="${h}" viewBox="0 0 200 240" overflow="visible"><defs>${rr.defs}</defs>${rr.svg}</svg>`;
    });
  }
  return `<svg xmlns="${SVGNS}" viewBox="0 0 360 230" width="360" height="230">${s}</svg>`;
}

/* ---------- 그리기 ---------- */
async function renderChar(el, d, k){
  if (!d.pixel){ el.innerHTML = wrapSvg(drawChar(d, k)); return; }
  const r = drawChar(d, k, true), svg = wrapSvg(r);
  const spr = await pixelate(svg, 64, 77, palOf(svg), '#1a1424');
  el.replaceChildren(upscale(spr, 5, pixelBg));
}
async function renderBoard(el, d){
  if (!d.pixel){ el.innerHTML = boardSvg(d, true); return; }
  const bsvg = boardSvg(d, false), s = 2;
  const base = await pixelate(bsvg, 180, 115, palOf(bsvg), null);
  const c = upscale(base, 4); const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  for (const [k, cc, rr] of PIECES.slice().sort((a, z) => (a[1] + a[2]) - (z[1] + z[2]))){
    const r = drawChar(d, k, true), svg = wrapSvg(r);
    const w = k === 'mage' ? 30 : 26, h = Math.round(w * 1.2);
    const spr = await pixelate(svg, w, h, palOf(svg), '#1a1424');
    const [px, py] = tileC(cc, rr);
    x.drawImage(spr, Math.round(px / s - w / 2) * 4, Math.round(py / s - h * .94) * 4, w * 4, h * 4);
  }
  el.replaceChildren(c);
}

/* ---------- 화면 ---------- */
const main = document.getElementById('main'), chips = document.getElementById('chips');
const state = {}, LS = 'mahocukai.dirs.draft';
try { Object.assign(state, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
const saveDraft = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };
const cls = v => v === '좋아' ? 'ok' : v === '애매' ? 'mid' : v === '별로' ? 'no' : '';
let db = null, writable = true, current = 'all', rateUI = null;
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); const f = e.target.__draw; e.target.__draw = null; f && f(); } }), { rootMargin: '300px' }) : null;
const lazy = (el, f) => { if (io){ el.__draw = f; io.observe(el); } else f(); };
const mk = (tag, cls2, text) => { const e = document.createElement(tag); if (cls2) e.className = cls2; if (text != null) e.textContent = text; return e; };

function buildChips(){
  chips.replaceChildren();
  const add = (id, label, num) => { const b = mk('button', 'chip'); b.type = 'button';
    if (num){ b.appendChild(mk('span', 'n', num)); } b.appendChild(document.createTextNode(label));
    const dot = mk('i', cls(state['dir-' + id]?.choice)); b.appendChild(dot);
    b.setAttribute('aria-current', String(current === id)); b.addEventListener('click', () => go(id)); chips.appendChild(b); };
  add('all', '한눈에'); DIRS.forEach((d, i) => add(d.id, d.name, String(i + 1)));
}
function go(id, noScroll){
  current = id; try { history.replaceState(null, '', '#' + id); } catch (e) {}
  buildChips(); const act = chips.querySelector('[aria-current="true"]'); if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
  id === 'all' ? overview() : detail(DIRS.find(d => d.id === id));
  if (!noScroll) window.scrollTo(0, document.querySelector('nav.chips').offsetTop);
}
function overview(){
  main.replaceChildren();
  const sec = mk('section', 'sec'); sec.append(mk('h2', '', '한눈에 보기'), mk('p', 'lead', '방향마다 마법사와 왕 작위 사역마야. 누르면 그 방향 전체(기사 작위, 적, 판 장면)로 가.'));
  const grid = mk('div', 'over');
  DIRS.forEach((d, i) => {
    const b = mk('button', 'tile'); b.type = 'button';
    const pair = mk('div', 'pair'); const a1 = mk('div', 'art'), a2 = mk('div', 'art'); pair.append(a1, a2); b.appendChild(pair);
    const cap = mk('div', 'cap'); cap.appendChild(mk('b', '', `${i + 1}. ${d.name}`));
    const v = state['dir-' + d.id]?.choice; cap.appendChild(v ? mk('span', 'badge ' + cls(v), v) : mk('span', '', d.ref));
    b.appendChild(cap); b.addEventListener('click', () => go(d.id)); grid.appendChild(b);
    lazy(pair, () => { renderChar(a1, d, 'mage'); renderChar(a2, d, 'famKing'); });
  });
  sec.appendChild(grid); main.appendChild(sec);
}
function card(d, k){
  const ch = d.chars[k], b = mk('button', 'card'); b.type = 'button'; b.setAttribute('aria-label', `${ch.name} 크게 보기`);
  const art = mk('div', 'art'); b.appendChild(art);
  const cap = mk('div', 'cap'); cap.append(mk('b', '', ch.name), mk('span', '', ch.sub)); b.appendChild(cap);
  b.addEventListener('click', () => zoom(d, k)); lazy(art, () => renderChar(art, d, k)); return b;
}
function detail(d){
  main.replaceChildren();
  const idx = DIRS.indexOf(d), wrap = mk('div', 'detail');
  const hd = mk('div', 'dhead'); hd.append(mk('p', 'num', `${idx + 1} / ${DIRS.length}`), mk('h2', '', d.name), mk('p', 'd', d.d), mk('p', 'refs', '참고: ' + d.ref));
  const pc = mk('div', 'pc'); const g = mk('div', 'g'); g.append(mk('b', '', '좋은 점'), document.createTextNode(d.g)); const r = mk('div', 'r'); r.append(mk('b', '', '걱정'), document.createTextNode(d.r)); pc.append(g, r); hd.appendChild(pc);
  wrap.appendChild(hd);
  const s1 = mk('section', 'sec'); s1.appendChild(mk('h3', '', '마법사와 적'));
  const g1 = mk('div', 'grid'); g1.append(card(d, 'mage'), card(d, 'foe')); s1.appendChild(g1);
  const s2 = mk('section', 'sec'); s2.append(mk('h3', '', '같은 사역마의 기사 작위 → 왕 작위'), mk('p', 'hint', '돌파·승급하면 이렇게 바뀌어. 귀여운 핵심 하나는 왕까지 남겨뒀어.'));
  const g2 = mk('div', 'grid'); g2.append(card(d, 'famK'), card(d, 'famKing')); s2.appendChild(g2);
  const s3 = mk('section', 'sec'); s3.append(mk('h3', '', '7×7 판 위에서'), mk('p', 'hint', '실제 전투 크기(말 하나가 손톱만 함)로 놓았어. 파란 고리는 내 편, 빨간 고리는 적, 주황 점선은 영창 중인 마법 범위.'));
  const bw = mk('button', 'card wide'); bw.type = 'button'; bw.setAttribute('aria-label', '판 장면 크게 보기'); const ba = mk('div', 'art board'); bw.appendChild(ba); bw.addEventListener('click', () => zoom(d, 'board'));
  lazy(ba, () => renderBoard(ba, d)); s3.appendChild(bw);
  wrap.append(s1, s2, s3, rateBox(d));
  const pg = mk('div', 'pager'); const prev = mk('button', '', '← 이전'), next = mk('button', '', idx === DIRS.length - 1 ? '한눈에 보기' : '다음 →'); prev.type = next.type = 'button';
  prev.disabled = idx === 0; prev.addEventListener('click', () => go(DIRS[idx - 1].id)); next.addEventListener('click', () => go(idx === DIRS.length - 1 ? 'all' : DIRS[idx + 1].id));
  pg.append(prev, next); wrap.appendChild(pg); main.appendChild(wrap);
}
const busy = {}, again = {}, timers = {};
function rateBox(d){
  const key = 'dir-' + d.id; if (!state[key]) state[key] = { choice: '', note: '' };
  const box = mk('section', 'rate'); box.setAttribute('aria-labelledby', 'rate-h');
  const h = mk('h3', '', `"${d.name}" 어때?`); h.id = 'rate-h';
  const opts = mk('div', 'opts'); opts.setAttribute('role', 'group');
  const btns = ['좋아', '애매', '별로'].map(v => { const b = mk('button', 'opt', v); b.type = 'button'; b.dataset.v = v; b.setAttribute('aria-pressed', String(state[key].choice === v));
    b.addEventListener('click', () => { const cur = state[key]; cur.choice = cur.choice === v ? '' : v; btns.forEach(x => x.setAttribute('aria-pressed', String(cur.choice === x.dataset.v))); save(key, d.name); buildChips(); }); return b; });
  opts.append(...btns);
  const ta = mk('textarea'); ta.rows = 2; ta.placeholder = '좋은 점, 섞고 싶은 점 (예: 마도구 사역마 + 꼬마 마녀 주인공)'; ta.value = state[key].note || ''; ta.setAttribute('aria-label', `${d.name} 메모`);
  ta.addEventListener('input', () => { state[key].note = ta.value; clearTimeout(timers[key]); timers[key] = setTimeout(() => { timers[key] = null; save(key, d.name); }, 900); });
  ta.addEventListener('blur', () => { if (timers[key]){ clearTimeout(timers[key]); timers[key] = null; save(key, d.name); } });
  const st = mk('p', 'st'); st.setAttribute('aria-live', 'polite'); st.textContent = db ? '' : '저장 연결 중…';
  box.append(h, opts, ta, st); rateUI = { key, btns, ta, st }; return box;
}
async function save(key, title){
  saveDraft(); if (!db || !writable) return;
  if (busy[key]){ again[key] = true; return; }
  busy[key] = true; const u = rateUI && rateUI.key === key ? rateUI : null;
  if (u){ u.st.className = 'st'; u.st.textContent = '저장 중…'; }
  try { const s = state[key]; await db.doc('answers/' + key).set({ q: key, title, choice: s.choice || '', note: s.note || '', updatedAt: new Date().toISOString() }); if (u){ u.st.className = 'st ok'; u.st.textContent = '저장됨'; } }
  catch (e) { if (e && e.code === 'invalid_argument') writable = false; if (u){ u.st.className = 'st err'; u.st.textContent = writable ? '저장이 안 됐어. 잠시 뒤에 다시 해줘.' : '이 계정으로는 저장할 수 없어. 채팅으로 알려줘.'; } }
  busy[key] = false; if (again[key]){ again[key] = false; save(key, title); }
}
const zoomEl = document.getElementById('zoom'), zoomArt = document.getElementById('zoomArt'), zoomCap = document.getElementById('zoomCap');
let lastFocus = null;
function zoom(d, k){
  lastFocus = document.activeElement; zoomArt.className = 'art' + (k === 'board' ? ' w' : '');
  if (k === 'board'){ renderBoard(zoomArt, d); zoomCap.textContent = `${d.name} · 7×7 판 장면`; }
  else { renderChar(zoomArt, d, k); zoomCap.textContent = `${d.name} · ${d.chars[k].name} — ${d.chars[k].sub}`; }
  zoomEl.hidden = false; zoomEl.focus();
}
const closeZoom = () => { zoomEl.hidden = true; zoomArt.replaceChildren(); if (lastFocus) lastFocus.focus(); };
zoomEl.addEventListener('click', closeZoom); addEventListener('keydown', e => { if (e.key === 'Escape' && !zoomEl.hidden) closeZoom(); });

const startId = (location.hash || '').slice(1);
go(DIRS.some(d => d.id === startId) ? startId : 'all', true);
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db){ if (rateUI) rateUI.st.textContent = '여기선 저장이 안 될 수 있어. 그럼 채팅으로 알려줘.'; return; }
  if (rateUI) rateUI.st.textContent = '';
  db.collection('answers').onSnapshot(snap => {
    snap.docs.forEach(doc => { const v = doc.data(); if (!v || !doc.id.startsWith('dir-')) return; const key = doc.id; if (busy[key] || timers[key]) return;
      state[key] = { choice: typeof v.choice === 'string' ? v.choice : '', note: typeof v.note === 'string' ? v.note : '' };
      if (rateUI && rateUI.key === key){ rateUI.btns.forEach(b => b.setAttribute('aria-pressed', String(state[key].choice === b.dataset.v))); if (document.activeElement !== rateUI.ta) rateUI.ta.value = state[key].note; } });
    saveDraft(); buildChips();
  }, () => {});
})();
window.__D = { DIRS, renderChar, renderBoard };
})();
</script>
