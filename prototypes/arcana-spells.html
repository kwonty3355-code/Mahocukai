<title>대마법 시연</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* Layout: 전장 화면이 주인공. 아래에 스킬 3개 버튼, 속도, 소리, 평가. 폰 우선. */
:root{
  --bg:#0d0c10; --paper:#18161c; --ink:#ece8ee; --muted:#a39daa; --line:#2c2930;
  --accent:#ff7a5a; --ok:#6cc495; --mid:#d8b860; --no:#e48a72; color-scheme:dark;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Apple SD Gothic Neo",serif;
}
:root[data-theme="light"]{ --bg:#f2f0ec; --paper:#ffffff; --ink:#1c1a20; --muted:#625c68; --line:#dcd8d0; --accent:#d8432a; --ok:#2f7d55; --mid:#9a7a2a; --no:#a1462e; color-scheme:light }
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-right,0px)) 70px max(12px,env(safe-area-inset-left,0px));display:grid;gap:14px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,5.5vw,30px);line-height:1.2;margin:0}
p{margin:0}
.lead{color:var(--muted);font-size:14px}
.stage{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:4px}
.cv{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#000;cursor:pointer}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:12px;bottom:10px;font-family:var(--serif);font-weight:900;color:#fff;font-size:clamp(14px,3.4vw,20px);letter-spacing:.2em;text-shadow:0 0 12px rgba(0,0,0,.9);pointer-events:none;opacity:.9}
.spells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spell{font:inherit;font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.08em;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 4px;cursor:pointer;color:#fff;min-height:60px;line-height:1.25}
.spell small{display:block;font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:0;opacity:.8}
.spell[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border:none;background:transparent;color:var(--ink);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ghost{font:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:38px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.card h2{margin:0;font-size:14px;color:var(--muted)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:40px}
.opt[aria-pressed="true"][data-v="좋아"]{background:var(--ok);border-color:var(--ok);color:#111}
.opt[aria-pressed="true"][data-v="애매"]{background:var(--mid);border-color:var(--mid);color:#111}
.opt[aria-pressed="true"][data-v="별로"]{background:var(--no);border-color:var(--no);color:#111}
textarea{font:inherit;font-size:16px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);resize:vertical}
.st{font-size:12px;color:var(--muted);min-height:1.1em}.st.ok{color:var(--ok)}.st.err{color:var(--no)}
.hint{font-size:13px;color:var(--muted)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>대마법 시연</h1>
    <p class="lead">마법진이 <b>한 바퀴 닦으며 나타나고</b>, 겹마다 돌면서 조립돼. 쏘는 마법은 내 발밑에, 내리꽂는 마법은 적 위 하늘에, 빨아들이는 마법은 적 발밑에 펼쳐져. 소리 꼭 켜.</p>
  </header>
  <div class="stage"><div class="cv" id="cv" role="button" tabindex="0" aria-label="전장 화면. 누르면 고른 마법 다시 쓰기"><span class="cap" id="cap"></span></div></div>
  <div class="spells" id="spells"></div>
  <div class="row2"><div class="seg" id="speed" role="group" aria-label="속도"></div><button class="ghost" id="snd" type="button" aria-pressed="true">소리 켜짐</button><button class="ghost" id="calm" type="button" aria-pressed="false">번쩍임 줄이기</button></div>
  <section class="card" id="rate"></section>
</div>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

/* ================= 소리 (잔향 포함) ================= */
const AU = { ctx: null, master: null, duck: null, wet: null, on: true };
function audio(){

    if (!AU.ctx){ const K = window.AudioContext || window.webkitAudioContext; if (!K) return null; const c = AU.ctx = new K();

      conv.buffer = ir; AU.wet = c.createGain(); AU.wet.gain.value = .38;
      AU.master.connect(AU.duck); AU.duck.connect(comp); AU.duck.connect(conv); conv.connect(AU.wet); AU.wet.connect(comp); comp.connect(c.destination); }
    if (AU.ctx.state === 'suspended') AU.ctx.resume();

}
const NB = {}; function nbuf(d){ const k = Math.ceil(d * 10); if (NB[k]) return NB[k]; const c = AU.ctx, b = c.createBuffer(1, c.sampleRate * (k / 10 + .05), c.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; return NB[k] = b; }
function tone(type, f0, f1, d, v, s = 0, att = .006, out){ const c = audio(); if (!c) return; const t = c.currentTime + s, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(out || AU.master); o.start(t); o.stop(t + d + .05); return o; }
function hiss(type, f0, f1, d, v, q = .8, s = 0, att = .004){ const c = audio(); if (!c) return; const t = c.currentTime + s, src = c.createBufferSource(); src.buffer = nbuf(d); const f = c.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d); const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + att); g.gain.exponentialRampToValueAtTime(.0001, t + d); src.connect(f); f.connect(g); g.connect(AU.master); src.start(t); src.stop(t + d + .05); }
function duck(v, tc = .03){ if (!AU.ctx) return; AU.duck.gain.cancelScheduledValues(AU.ctx.currentTime); AU.duck.gain.setTargetAtTime(v, AU.ctx.currentTime, tc); }
const semi = n => Math.pow(2, n / 12);
const SFX = {
  sweep(){ hiss('bandpass', 1200, 9000, .34, .5, 1.6, 0, .02); tone('sine', 600, 2400, .3, .06); },
  ching(i){ const f = 1500 * semi(i * 3); tone('sine', f, f, .5, .12); tone('sine', f * 1.34, f * 1.34, .4, .07); hiss('highpass', 5000, 8000, .05, .25); },
  charge(d){ const c = audio(); if (!c) return; const t = c.currentTime, src = c.createBufferSource(); src.buffer = nbuf(d); const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3; f.frequency.setValueAtTime(2500, t); f.frequency.exponentialRampToValueAtTime(7000, t + d);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + d * .9); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.setValueAtTime(10, t); lfo.frequency.linearRampToValueAtTime(32, t + d); lg.gain.value = .5; const am = c.createGain(); am.gain.value = .5; lfo.connect(lg); lg.connect(am.gain);
    src.connect(f); f.connect(am); am.connect(g); g.connect(AU.master); src.start(t); src.stop(t + d + .05); lfo.start(t); lfo.stop(t + d + .05); tone('sine', 220, 880, d, .07, 0, d * .8); },
  hit(w, p = 0){ const k = semi(p) * rand(.96, 1.04); hiss('highpass', 2600 * k, 7000, .05, .55 + w * .2); tone('sine', 140 * k, 34, .15 + w * .6, Math.min(1, .4 + w * .6)); if (w > .4){ hiss('lowpass', 3000, 80, .5 + w, .5 * w); tone('triangle', 92, 88, 1 + w, .12 * w); tone('triangle', 97, 93, 1.1 + w, .1 * w); } },
  boom(){ tone('sine', 70, 22, 2.4, 1); hiss('lowpass', 5000, 60, 2.6, .9, .5); hiss('highpass', 2500, 9000, .3, .5); },
  crackle(d, n){ for (let i = 0; i < n; i++) hiss('highpass', rand(2500, 6000), rand(1500, 3000), rand(.02, .05), rand(.25, .5), 2, rand(0, d)); tone('square', 58, 56, d, .08); tone('sawtooth', 120, 90, d, .05); },
  roar(){ const c = audio(); if (!c) return; const t = c.currentTime, ws = c.createWaveShaper(), curve = new Float32Array(256); for (let i = 0; i < 256; i++){ const xx = i / 128 - 1; curve[i] = Math.tanh(xx * 4); } ws.curve = curve;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1900, t + .35); f.frequency.linearRampToValueAtTime(700, t + 1.1);
    const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.6, t + .08); g.gain.setValueAtTime(.6, t + .7); g.gain.exponentialRampToValueAtTime(.0001, t + 1.2); ws.connect(f); f.connect(g); g.connect(AU.master);
    [1, 1.007, 1.5].forEach(m => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(260 * m, t); o.frequency.exponentialRampToValueAtTime(720 * m, t + .3); o.frequency.exponentialRampToValueAtTime(190 * m, t + 1.15); o.connect(ws); o.start(t); o.stop(t + 1.25); });
    hiss('bandpass', 1500, 600, 1.1, .35, 1.2, 0, .05); },
  shing(){ tone('sine', 3400, 3300, 1.2, .2); tone('sine', 4520, 4400, 1, .1); hiss('highpass', 4000, 9000, .25, .5); tone('triangle', 1700, 1650, .8, .08); },
  whoosh(d = .25, v = .45){ hiss('bandpass', 400, 5000, d, v, 1.4, 0, d * .7); },
  inhale(d){ hiss('lowpass', 200, 2200, d, .5, .7, 0, d * .95); tone('sine', 40, 90, d, .4, 0, d * .9); },
  rumble(d){ tone('sine', 34, 30, d, .55, 0, .3); tone('sawtooth', 46, 40, d, .08, 0, .5); hiss('lowpass', 180, 120, d, .35, .5, 0, .4); },
  ring(){ tone('sine', 4200, 4200, 1.6, .035, 0, .3); },
};

/* ================= 화면 (2D 장면 → WebGL 후처리) ================= */
const host = document.getElementById('cv');
const sc = document.createElement('canvas'), x = sc.getContext('2d');
const small = document.createElement('canvas'), sx2 = small.getContext('2d');
let W = 0, H = 0, DPR = 1, GL = null, glc = null;
function initGL(){
  glc = document.createElement('canvas');
  const gl = glc.getContext('webgl', { premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: true });

  const fs = `precision mediump float; varying vec2 v; uniform sampler2D T; uniform vec2 R;
  uniform vec4 SH0; uniform vec4 SH1; uniform vec4 SH2; uniform vec4 BH; uniform vec4 SL; uniform float SLO; uniform float CH; uniform float INV;

    if (BH.w > 0.){ vec2 d = p - BH.xy; float r = max(length(d), 1.); q -= d / r * (BH.z * BH.z * 1.25 * BH.w) / r; float sw = BH.w * 2.2 * BH.z / (r + BH.z * .4); float c = cos(sw), s = sin(sw); vec2 dd = q - BH.xy; q = BH.xy + vec2(dd.x * c - dd.y * s, dd.x * s + dd.y * c); }
    float side = 0.;
    if (SL.w > 0. || SLO > 0.){ vec2 n = vec2(cos(SL.z), sin(SL.z)); vec2 t = vec2(-n.y, n.x); float sd = dot(p - SL.xy, n); side = sd > 0. ? 1. : -1.; q -= t * side * SLO + n * side * SL.w; }

try { GL = initGL(); } catch (e) { GL = null; }
host.insertBefore(GL ? glc : sc, host.firstChild);
function fit(){ const r = host.getBoundingClientRect(); DPR = Math.min(1.6, devicePixelRatio || 1); W = r.width; H = r.height; sc.width = Math.round(W * DPR); sc.height = Math.round(H * DPR); small.width = Math.max(1, sc.width >> 2); small.height = Math.max(1, sc.height >> 2); if (glc){ glc.width = sc.width; glc.height = sc.height; } }

/* ================= 상태 ================= */
const S = { real: 0, T: 0, stop: 0, slowUntil: 0, slowScale: 1, speed: 1, trauma: 0, calm: false, busy: false,
  shocks: [], bh: { x: 0, y: 0, r: 0, w: 0 }, slice: { x: 0, y: 0, a: 0, gap: 0, off: 0 }, chroma: 0, invert: 0,
  bgBlack: 0, desat: 0, dim: 0, letter: 0, zoom: 1, zx: 0, zy: 0, flash: 0, flashCol: '#fff', title: null };
let parts = [], fx = [], nums = [], ev = [], circles = [];
const at = (t, fn) => ev.push({ t: S.T + t, fn });
const P = o => { const p = Object.assign({ vx: 0, vy: 0, g: 0, drag: 0, life: 1, r: 2, col: '#fff', add: true, kind: 'dot', shrink: true }, o); p.max = p.life; parts.push(p); };
const FX = (dur, draw, o = {}) => fx.push(Object.assign({ t0: S.T, dur, draw }, o));

/* ================= 무대 ================= */
const SHAPE = ['XX...XX', 'X.....X', '.......', '.......', '.......', 'X.....X', 'XX...XX'];
const tw = () => W / 7;
const tc = (c, r) => { const t = tw(); return [W / 2 + (c - r) * t / 2, H * .4 + (c + r) * t / 4 + t / 4]; };
const STARS = (() => { const r = mulberry(9); return Array.from({ length: 160 }, () => [r(), r() * .62, r() * 1.3 + .3, r()]); })();
const MOUNT = (() => { const r = mulberry(4); const a = [], b = []; for (let i = 0; i <= 24; i++){ a.push([i / 24, .42 + r() * .1 - Math.sin(i / 24 * 3) * .04]); b.push([i / 24, .5 + r() * .07]); } return [a, b]; })();
function background(){
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0b1e'); g.addColorStop(.55, '#22183a'); g.addColorStop(1, '#0c0812'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.globalCompositeOperation = 'lighter'; for (const [sx, sy, r, b] of STARS){ x.globalAlpha = .3 + .5 * b * (.7 + .3 * Math.sin(S.real * 2 + b * 9)); x.fillStyle = '#dfe4ff'; x.fillRect(sx * W, sy * H, r, r); } x.restore();
  const moon = x.createRadialGradient(W * .78, H * .16, 0, W * .78, H * .16, H * .22); moon.addColorStop(0, 'rgba(230,220,255,.35)'); moon.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = moon; x.fillRect(0, 0, W, H);
  [[MOUNT[0], '#17122a'], [MOUNT[1], '#100c1c']].forEach(([m, c]) => { x.fillStyle = c; x.beginPath(); x.moveTo(0, H); m.forEach(([u, v]) => x.lineTo(u * W, v * H)); x.lineTo(W, H); x.fill(); });
  const mist = x.createLinearGradient(0, H * .45, 0, H * .62); mist.addColorStop(0, 'rgba(120,100,160,0)'); mist.addColorStop(.5, 'rgba(120,100,160,.12)'); mist.addColorStop(1, 'rgba(120,100,160,0)'); x.fillStyle = mist; x.fillRect(0, H * .45, W, H * .17);
}
function board(alpha = 1){
  if (alpha <= .01) return; const t = tw(), th = t / 2; x.save(); x.globalAlpha = alpha;
  for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++){ if (SHAPE[r][c] === 'X') continue; const [px, py] = tc(c, r);
